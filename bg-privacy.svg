<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <style>
      .line { stroke:#4386b8; stroke-width:1.2; fill:none; opacity:.13; stroke-linecap:round; stroke-linejoin:round; }
      .dash { stroke:#4386b8; stroke-width:1.1; fill:none; opacity:.10; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:6 8; }
      .node { fill:#4386b8; opacity:.16; }
      .nodeRing { stroke:#4386b8; stroke-width:1.2; fill:none; opacity:.15; }
      .dev { stroke:#4386b8; stroke-width:1.2; fill:none; opacity:.12; stroke-linecap:round; stroke-linejoin:round; }
      .devFill { fill:#4386b8; opacity:.10; }
      .icon { stroke:#4386b8; stroke-width:1.4; fill:none; opacity:.12; stroke-linecap:round; stroke-linejoin:round; }
      .txt { fill:#4386b8; opacity:.09; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto; font-size:10px; letter-spacing:.12em; }
      .mono { fill:#4386b8; opacity:.08; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas; font-size:10px; letter-spacing:.18em; }
    </style>
  </defs>

  <!-- Large padlock -->
  <g class="icon" transform="translate(70,60)">
    <rect x="0" y="60" width="120" height="96" rx="18"/>
    <path d="M24 60 V38 a36 36 0 0 1 72 0 V60"/>
    <circle cx="60" cy="100" r="10"/>
    <path d="M60 110 V132"/>
  </g>

  <!-- Large shield with check -->
  <g class="icon" transform="translate(640,50) scale(1.6)">
    <path d="M30 10 q30-16 60 0 v30 q0 34-30 48 q-30-14-30-48z"/>
    <path d="M44 46 l12 12 l20-24"/>
  </g>

  <!-- Fingerprint -->
  <g class="line" transform="translate(430,340)">
    <path d="M-12 24 V0 a12 12 0 0 1 24 0 V30"/>
    <path d="M-26 34 V0 a26 26 0 0 1 52 0 V20"/>
    <path d="M-40 20 V0 a40 40 0 0 1 80 0 V40"/>
    <path d="M-54 40 V0 a54 54 0 0 1 108 0 V30"/>
    <path d="M-68 10 V0 a68 68 0 0 1 136 0 V50"/>
  </g>
  <circle class="nodeRing" cx="430" cy="340" r="84"/>

  <!-- Redacted document -->
  <g transform="translate(70,380)">
    <rect class="dev" x="0" y="0" width="210" height="250" rx="16"/>
    <path class="dev" d="M24 34 H110"/>
    <rect class="devFill" x="24" y="62" width="150" height="12" rx="2"/>
    <path class="dev" d="M24 96 H180"/>
    <rect class="devFill" x="24" y="120" width="110" height="12" rx="2"/>
    <rect class="devFill" x="146" y="120" width="40" height="12" rx="2"/>
    <path class="dev" d="M24 154 H160"/>
    <rect class="devFill" x="24" y="178" width="170" height="12" rx="2"/>
    <path class="dev" d="M24 212 H100"/>
  </g>

  <!-- Eye-slash -->
  <g class="icon" transform="translate(640,400)">
    <path d="M0 40 Q60 -14 120 40 Q60 94 0 40 Z"/>
    <circle cx="60" cy="40" r="16"/>
    <path d="M14 96 L106 -16"/>
  </g>

  <!-- Encryption flow -->
  <g transform="translate(70,730)">
    <rect class="dev" x="0" y="0" width="150" height="54" rx="14"/>
    <path class="dev" d="M20 20 H120"/>
    <path class="dev" d="M20 36 H96"/>
    <path class="line" d="M150 27 H230"/>
    <path class="line" d="M222 21 l8 6 l-8 6"/>
    <g class="icon" transform="translate(250,27)">
      <rect x="-14" y="-4" width="28" height="22" rx="5" transform="translate(0 -9)"/>
      <path d="M-8 -13 V-20 a8 8 0 0 1 16 0 V-13" transform="translate(0 -0)"/>
    </g>
    <path class="line" d="M280 27 H360"/>
    <path class="line" d="M352 21 l8 6 l-8 6"/>
    <rect class="dev" x="360" y="0" width="150" height="54" rx="14"/>
    <rect class="devFill" x="380" y="16" width="14" height="10" rx="2"/>
    <rect class="devFill" x="400" y="16" width="30" height="10" rx="2"/>
    <rect class="devFill" x="436" y="16" width="20" height="10" rx="2"/>
    <rect class="devFill" x="380" y="32" width="40" height="10" rx="2"/>
    <rect class="devFill" x="426" y="32" width="24" height="10" rx="2"/>
    <text class="txt" x="10" y="-12">PLAINTEXT</text>
    <text class="txt" x="220" y="-12">AES-256</text>
    <text class="txt" x="370" y="-12">CIPHERTEXT</text>
  </g>

  <!-- Key + keyhole -->
  <g class="icon">
    <g transform="translate(560,640)">
      <circle cx="20" cy="30" r="18"/>
      <circle cx="20" cy="30" r="6"/>
      <path d="M38 30 H110 M90 30 V48 M104 30 V44"/>
    </g>
    <g transform="translate(740,640)">
      <circle cx="40" cy="40" r="36"/>
      <circle cx="40" cy="32" r="8"/>
      <path d="M36 40 L32 62 H48 L44 40"/>
    </g>
  </g>

  <!-- Data nodes -->
  <g>
    <path class="dash" d="M250 150 L346 340"/>
    <path class="dash" d="M640 130 L514 340"/>
    <path class="dash" d="M280 500 L346 360"/>
    <path class="dash" d="M640 460 L514 360"/>
    <path class="dash" d="M430 424 V560 L600 640"/>
    <circle class="node" cx="250" cy="150" r="3.4"/>
    <circle class="node" cx="640" cy="130" r="3.4"/>
    <circle class="node" cx="280" cy="500" r="3.4"/>
    <circle class="node" cx="640" cy="460" r="3.4"/>
    <circle class="node" cx="430" cy="560" r="3.4"/>
    <circle class="nodeRing" cx="430" cy="560" r="11"/>
    <circle class="nodeRing" cx="250" cy="150" r="11"/>
  </g>

  <g>
    <text class="txt" x="300" y="130">NO TRACKING</text>
    <text class="txt" x="300" y="150">NO COOKIES</text>
    <text class="txt" x="640" y="590">GDPR  CCPA</text>
    <text class="mono" x="320" y="520">-----BEGIN PRIVATE KEY-----</text>
    <text class="mono" x="320" y="600">A1B2 C3D4 E5F6 0789</text>
    <text class="mono" x="620" y="290">SHA-256  HMAC  ARGON2</text>
    <text class="mono" x="70" y="690">██████ ████ ███████</text>
    <text class="mono" x="500" y="860">TLS 1.3  HSTS  CSP</text>
    <text class="mono" x="70" y="880">DATA MINIMIZATION</text>
  </g>
</svg>
