<svg width="320" height="400" viewBox="0 0 320 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="400" fill="#F3F4F6"/>
  
  <!-- Gradient overlay -->
  <rect width="320" height="400" fill="url(#gradient)" opacity="0.3"/>
  
  <!-- User silhouette -->
  <circle cx="160" cy="140" r="50" fill="#9CA3AF"/>
  <path d="M160 200C110 200 80 230 80 270V400H240V270C240 230 210 200 160 200Z" fill="#9CA3AF"/>
  
  <!-- Text -->
  <text x="160" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#6B7280" font-weight="500">
    Add your photo
  </text>
  
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="320" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
