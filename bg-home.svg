      <path class="dev" d="M34 58 H84"/>
      <path class="dev" d="M16 72 H110"/>
    </g>
    <g transform="translate(700,60)">
      <rect class="dev" x="0" y="0" width="150" height="80" rx="16"/>
      <path class="dev" d="M20 26 H130"/>
      <path class="dev" d="M20 44 H108"/>
      <path class="dev" d="M20 62 H122"/>
      <circle class="devFill" cx="132" cy="62" r="3"/>
    </g>
    <g transform="translate(60,780)">
      <rect class="dev" x="0" y="0" width="160" height="70" rx="14"/>
      <circle class="devFill" cx="30" cy="35" r="3"/>
      <circle class="devFill" cx="50" cy="35" r="3"/>
      <circle class="devFill" cx="70" cy="35" r="3"/>
      <path class="dev" d="M104 35 h34"/>
    </g>
    <g transform="translate(690,770)">
      <rect class="dev" x="0" y="0" width="160" height="80" rx="16"/>
      <path class="dev" d="M20 26 H140"/>
      <path class="dev" d="M20 44 H116"/>
      <path class="dev" d="M20 62 H130"/>
    </g>
    <path class="dash" d="M200 100 L374.8 243.3"/>
    <path class="dash" d="M700 100 L615 164.2"/>
    <path class="dash" d="M200 800 L260.7 720.3"/>
    <path class="dash" d="M700 780 L735.8 615"/>
  </g>

  <!-- Globe + crosshair icons -->
  <g class="icon">
    <g transform="translate(780,340)">
      <circle cx="32" cy="32" r="22"/>
      <ellipse cx="32" cy="32" rx="9" ry="22"/>
      <path d="M10 32 H54"/>
    </g>
    <g transform="translate(60,520)">
      <circle cx="32" cy="32" r="22"/>
      <circle cx="32" cy="32" r="8"/>
      <path d="M32 6 v-10M32 68 v10M6 32 h-10M68 32 h10"/>
    </g>
  </g>

  <!-- Labels -->
  <g>
    <text class="txt" x="670" y="368">RECON</text>
    <text class="txt" x="390" y="236">EXPLOIT</text>
    <text class="txt" x="178" y="552">PERSIST</text>
    <text class="txt" x="540" y="680">REPORT</text>
    <text class="txt" x="620" y="160">RED TEAM</text>
    <text class="txt" x="110" y="330">OSINT</text>
    <text class="txt" x="270" y="744">C2</text>
    <text class="txt" x="745" y="640">PIVOT</text>

    <text class="mono" x="60" y="170">nmap -sV -sC 10.0.0.0/24</text>
    <text class="mono" x="640" y="170">whoami /priv</text>
    <text class="mono" x="60" y="760">0xDEADC0DE 0xBADF00D</text>
    <text class="mono" x="640" y="750">CVE-XXXX-XXXX  TTP  IOC</text>
    <text class="mono" x="260" y="60">AD  KERBEROS  LDAP  SMB</text>
    <text class="mono" x="520" y="870">01010010 01000101 01000100</text>
  </g>
