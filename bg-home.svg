<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <style>
      .line { stroke:#4386b8; stroke-width:1.2; fill:none; opacity:.13; stroke-linecap:round; stroke-linejoin:round; }
      .dash { stroke:#4386b8; stroke-width:1.1; fill:none; opacity:.10; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:6 8; }
      .node { fill:#4386b8; opacity:.16; }
      .nodeRing { stroke:#4386b8; stroke-width:1.2; fill:none; opacity:.15; }
      .dev { stroke:#4386b8; stroke-width:1.2; fill:none; opacity:.12; stroke-linecap:round; stroke-linejoin:round; }
      .devFill { fill:#4386b8; opacity:.10; }
      .icon { stroke:#4386b8; stroke-width:1.4; fill:none; opacity:.12; stroke-linecap:round; stroke-linejoin:round; }
      .txt { fill:#4386b8; opacity:.09; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto; font-size:10px; letter-spacing:.12em; }
      .mono { fill:#4386b8; opacity:.08; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas; font-size:10px; letter-spacing:.18em; }
    </style>
  </defs>

  <!-- Radar rings -->
  <g>
    <circle class="line" cx="450" cy="450" r="120"/>
    <circle class="line" cx="450" cy="450" r="220"/>
    <circle class="line" cx="450" cy="450" r="330"/>
    <circle class="dash" cx="450" cy="450" r="170"/>
    <circle class="dash" cx="450" cy="450" r="280"/>
    <path class="dash" d="M90 450 H810"/>
    <path class="dash" d="M450 90 V810"/>
    <path class="dash" d="M200 200 L700 700"/>
    <path class="dash" d="M700 200 L200 700"/>
    <path class="devFill" d="M450 450 L780 450 A330 330 0 0 0 735.8 285 Z"/>
    <path class="line" d="M450 450 L735.8 285"/>
  </g>

  <!-- Hub links -->
  <g>
    <path class="line" d="M450 450 L656.7 374.8"/>
    <path class="line" d="M450 450 L374.8 243.3"/>
    <path class="line" d="M450 450 L243.3 525.2"/>
    <path class="line" d="M450 450 L525.2 656.8"/>
    <path class="dash" d="M656.7 374.8 L735.8 615"/>
    <path class="dash" d="M374.8 243.3 L615 164.2"/>
    <path class="dash" d="M243.3 525.2 L139.9 337.1"/>
    <path class="dash" d="M525.2 656.8 L260.7 720.3"/>
    <path class="dash" d="M374.8 243.3 L139.9 337.1"/>
    <path class="dash" d="M656.7 374.8 L615 164.2"/>
    <path class="dash" d="M243.3 525.2 L260.7 720.3"/>
    <path class="dash" d="M525.2 656.8 L735.8 615"/>
  </g>

  <!-- Nodes -->
  <g>
    <circle class="node" cx="656.7" cy="374.8" r="3.4"/>
    <circle class="node" cx="374.8" cy="243.3" r="3.4"/>
    <circle class="node" cx="243.3" cy="525.2" r="3.4"/>
    <circle class="node" cx="525.2" cy="656.8" r="3.4"/>
    <circle class="node" cx="615" cy="164.2" r="3"/>
    <circle class="node" cx="139.9" cy="337.1" r="3"/>
    <circle class="node" cx="260.7" cy="720.3" r="3"/>
    <circle class="node" cx="735.8" cy="615" r="3"/>
    <circle class="node" cx="534.9" cy="365.1" r="2.6"/>
    <circle class="node" cx="365.1" cy="534.9" r="2.6"/>
    <circle class="nodeRing" cx="656.7" cy="374.8" r="11"/>
    <circle class="nodeRing" cx="374.8" cy="243.3" r="11"/>
    <circle class="nodeRing" cx="243.3" cy="525.2" r="11"/>
    <circle class="nodeRing" cx="525.2" cy="656.8" r="11"/>
    <circle class="nodeRing" cx="450" cy="450" r="58"/>
