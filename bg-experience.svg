  <g>
    <text class="mono" x="50" y="250">git log --oneline</text>
    <text class="mono" x="50" y="270">a1b2c3d  start</text>
    <text class="mono" x="50" y="290">e4f5a6b  grow</text>
    <text class="mono" x="740" y="250">T+00:00  KICKOFF</text>
    <text class="mono" x="740" y="270">T+72:00  REPORT</text>
    <text class="mono" x="740" y="600">SPRINT 01..N</text>
    <text class="mono" x="50" y="860">BACKEND  SECURITY  RESEARCH</text>
    <text class="mono" x="610" y="860">DEPLOY  ITERATE</text>
