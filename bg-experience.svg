      <path class="dev" d="M54 40 H150"/>
      <path class="dev" d="M20 62 H170"/>
      <circle class="devFill" cx="186" cy="62" r="3"/>
      <text class="txt" x="54" y="20">FREELANCE</text>
    </g>
    <g transform="translate(180,390)">
      <rect class="dev" x="0" y="0" width="210" height="80" rx="16"/>
      <circle class="dev" cx="30" cy="30" r="10"/>
